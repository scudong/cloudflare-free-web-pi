# push main → 部署 Worker（静态资产 + API 同域）。secrets: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    if: ${{ github.repository == 'scudong/pi-harness' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web --if-present
      # 金标回归：单元 + 接口用例，不通过就不部署
      - run: npm test
      - run: npx wrangler deploy --var BUILD:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
