<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Cloudflare Free Web Pi architecture">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1000" height="360" rx="18" fill="#0b1220"/>
  <rect x="1" y="1" width="998" height="358" rx="17" fill="none" stroke="#1e293b"/>

  <!-- browser -->
  <rect x="34" y="136" width="190" height="88" rx="12" fill="#111c2f" stroke="#334155"/>
  <text x="129" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#e2e8f0">Browser</text>
  <text x="129" y="194" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">React · SSE · chat / files</text>

  <line x1="224" y1="180" x2="278" y2="180" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- worker -->
  <rect x="284" y="136" width="226" height="88" rx="12" fill="#111c2f" stroke="#38bdf8" stroke-opacity=".6"/>
  <text x="397" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#e2e8f0">Cloudflare Worker</text>
  <text x="397" y="194" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">assets · /api · /s/&lt;token&gt;</text>

  <line x1="510" y1="180" x2="564" y2="180" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- durable object -->
  <rect x="570" y="52" width="392" height="256" rx="14" fill="#0f1a2c" stroke="#334155"/>
  <text x="590" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Durable Object · per user</text>
  <text x="590" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#64748b">invite-code spaces, fully isolated</text>

  <rect x="590" y="122" width="352" height="46" rx="8" fill="#111c2f" stroke="#1e293b"/>
  <text x="606" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#cbd5e1">pi-durable harness · tools · tasks</text>

  <rect x="590" y="178" width="352" height="46" rx="8" fill="#111c2f" stroke="#1e293b"/>
  <text x="606" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#cbd5e1">SQLite · sessions · files · KB (FTS5) · shares</text>

  <rect x="590" y="234" width="352" height="46" rx="8" fill="#111c2f" stroke="#1e293b"/>
  <text x="606" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#cbd5e1">QuickJS codemode · MCP · subagents</text>

  <!-- model -->
  <rect x="746" y="4" width="216" height="34" rx="8" fill="#111c2f" stroke="#334155" stroke-dasharray="4 3"/>
  <text x="854" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#94a3b8">DeepSeek / OpenAI-compatible</text>
  <line x1="854" y1="38" x2="854" y2="50" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="34" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#64748b">No server · no external database · one deploy</text>
</svg>
