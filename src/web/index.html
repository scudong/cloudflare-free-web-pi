<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#17171a" />
    <meta name="description" content="Cloudflare Free Web Pi（π Harness）—— 部署在 Cloudflare Worker 上的多用户 AI 工作台：durable agent、文件分享、独立知识库。" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cloudflare Free Web Pi" />
    <meta property="og:title" content="Cloudflare Free Web Pi · π Harness" />
    <meta property="og:description" content="A free, multi-user web Pi agent workspace on Cloudflare Workers + Durable Objects. No server, no external database." />
    <meta property="og:url" content="https://pi-harness-gw.pages.dev/" />
    <meta property="og:image" content="https://pi-harness-gw.pages.dev/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cloudflare Free Web Pi" />
    <meta name="twitter:description" content="Durable pi agent · per-user spaces · Chinese knowledge base · shareable files. On Cloudflare's free tier." />
    <meta name="twitter:image" content="https://pi-harness-gw.pages.dev/social-preview.png" />
    <title>Cloudflare Free Web Pi · π Harness</title>
  </head>
  <body>
    <script>
      // 首屏应用主题，避免闪烁（v0.11.0；v0.24.0 支持四套主题）
      try {
        var META = {
          dark: { cls: "", scheme: "dark", color: "#17171a" },
          light: { cls: "theme-light", scheme: "light", color: "#f7f8fa" },
          sepia: { cls: "theme-sepia", scheme: "light", color: "#fcf8ec" },
          midnight: { cls: "theme-midnight", scheme: "dark", color: "#0b1220" }
        };
        var param = new URLSearchParams(location.search).get("theme");
        var saved = param || localStorage.getItem("pi-theme") || "light";
        if (saved === "system") {
          saved = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        var meta = META[saved] || META.light;
        if (meta.cls) document.documentElement.classList.add(meta.cls);
        document.querySelector('meta[name="color-scheme"]').content = meta.scheme;
        document.querySelector('meta[name="theme-color"]').content = meta.color;
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
