# PR 跑构建和金标回归；push main 在通过后部署 Worker（静态资产 + API 同域）。
# deploy secrets: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
name: deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web --if-present
      - run: bash scripts/check-layering.sh
      # Skill Hub 目录门禁：catalog 出现 blocked、sha256 漂移或 audit.hash 不一致即失败（NERE-55）
      - run: npm run catalog:check
      - run: npm test

  deploy:
    needs: test
    if: ${{ github.event_name == 'push' && github.repository == 'scudong/cloudflare-free-web-pi' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # deploy job 是独立 runner：必须重新构建静态资产，否则 wrangler 找不到 dist-web
      - run: npm run build:web --if-present
      - run: npx wrangler deploy --var BUILD:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 部署后冒烟：先等 Durable Object 换成本次构建（最多 ~6 分钟），再打线上接口 + 真跑一次 codemode
      - name: 线上冒烟
        env:
          PI_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          if [ -z "$PI_PASSWORD" ]; then
            echo "未配置 SMOKE_PASSWORD secret，跳过线上冒烟"
            exit 0
          fi
          BASE=https://pi-harness-gw.pages.dev
          JAR=$(mktemp)
          curl -s -c "$JAR" -X POST "$BASE/api/login" -H 'content-type: application/json' \
            -d "{\"password\":\"$PI_PASSWORD\"}" > /dev/null
          for i in $(seq 1 18); do
            BUILD=$(curl -s -b "$JAR" "$BASE/api/version" | grep -o '"build":"[^"]*"' | cut -d'"' -f4)
            echo "试图 $i：线上构建 ${BUILD:-未知}"
            if [ "$BUILD" = "${{ github.sha }}" ]; then
              echo "DO 已切到本次构建"
              break
            fi
            sleep 20
          done
          npm run smoke -- --deep
