<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="π Harness —— Cloudflare Worker 上的 pi-durable 会话前端。" />
    <title>π Harness</title>
  </head>
  <body>
    <script>
      // 首屏应用主题，避免闪烁（v0.11.0；v0.24.0 支持四套主题）
      try {
        var META = {
          dark: { cls: "", scheme: "dark", color: "#020617" },
          light: { cls: "theme-light", scheme: "light", color: "#f8fafc" },
          sepia: { cls: "theme-sepia", scheme: "light", color: "#f4eee1" },
          midnight: { cls: "theme-midnight", scheme: "dark", color: "#060b18" }
        };
        var param = new URLSearchParams(location.search).get("theme");
        var saved = param || localStorage.getItem("pi-theme") || "dark";
        if (saved === "system") {
          saved = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        var meta = META[saved] || META.dark;
        if (meta.cls) document.documentElement.classList.add(meta.cls);
        document.querySelector('meta[name="color-scheme"]').content = meta.scheme;
        document.querySelector('meta[name="theme-color"]').content = meta.color;
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
